scope: >-
  Clinical guidance on loop diuretic use in the disease areas where it is dosed:
  heart failure, acute kidney injury, chronic kidney disease, cirrhosis with ascites.
  Per area, the latest guideline of a US society, a European society, KDIGO where it
  covers the area, and Japan; plus the FDA labels of furosemide.
