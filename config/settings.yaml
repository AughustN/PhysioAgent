llm:
  # MIMIC-IV rows may only go to a model we serve ourselves (PhysioNet DUA). The default
  # is a vLLM server on the same machine; `mode: local` skips the API-key check.
  # LLM_PROVIDER, LLM_MODE, MODEL_NAME and OPENAI_BASE_URL in the environment override
  # these values (eval/slurm/run_cohort_dose.slurm sets them).
  mode: local
  provider: local_vllm
  providers:
    # model_name must match what `vllm serve` was started with; vLLM rejects any other
    # name. Arms are comparable only when scored by the same model: keep one results
    # folder per model (PHYSIOAGENT_DOSE_RESULTS).
    local_vllm:
      base_url: http://127.0.0.1:8000/v1
      model_name: RedHatAI/gemma-3-12b-it-FP8-dynamic
