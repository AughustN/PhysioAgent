      <line x1="20" y1="40" x2="38" y2="20"/><line x1="20" y1="40" x2="30" y2="64"/>
      <line x1="38" y1="20" x2="52" y2="46"/><line x1="30" y1="64" x2="52" y2="46"/>
      <line x1="52" y1="46" x2="70" y2="28"/><line x1="52" y1="46" x2="64" y2="66"/>
      <line x1="70" y1="28" x2="88" y2="50"/><line x1="64" y1="66" x2="88" y2="50"/>
    </g>
