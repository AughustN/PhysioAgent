      <line x1="26" y1="-4" x2="20" y2="18"/><line x1="20" y1="18" x2="2" y2="26"/>
      <line x1="2" y1="26" x2="-20" y2="16"/><line x1="-20" y1="16" x2="-28" y2="0"/>
      <line x1="-28" y1="0" x2="-22" y2="-14"/><line x1="0" y1="0" x2="26" y2="-4"/>
      <line x1="-8" y1="-26" x2="0" y2="0"/>
    </g>
    <circle cx="0" cy="0" r="5.5" fill="#2E86C1"/>
    <circle cx="-22" cy="-14" r="4" fill="#E67E22"/>
    <circle cx="-8" cy="-26" r="3.6" fill="#3CC9A0"/>
    <circle cx="14" cy="-22" r="4" fill="#2E86C1"/>
    <circle cx="26" cy="-4" r="3.6" fill="#3CC9A0"/>
    <circle cx="20" cy="18" r="4" fill="#E67E22"/>
    <circle cx="2" cy="26" r="3.6" fill="#2E86C1"/>
    <circle cx="-20" cy="16" r="4" fill="#3CC9A0"/>
    <circle cx="-28" cy="0" r="3.2" fill="#2E86C1"/>
    <circle cx="-12" cy="8" r="3" fill="#E67E22"/>
  </g>
  <text class="lbl" x="612" y="290" text-anchor="middle">Raw KG</text>
  <line class="edge" x1="646" y1="235" x2="718" y2="235" marker-end="url(#ah)"/>

  <!-- merging -->
  <rect x="720" y="207" width="180" height="56" rx="4" fill="#9ED9D4" stroke="#3E8E89" stroke-width="1.4"/>
  <text class="lbl" x="810" y="231" text-anchor="middle">Entity &amp; Relation</text>
  <text class="lbl" x="810" y="249" text-anchor="middle">Merging</text>
  <line class="edge" x1="900" y1="235" x2="982" y2="235" marker-end="url(#ah)"/>

  <!-- final KG -->
  <g transform="translate(1030,235)">
    <g stroke="#D08A5C" stroke-width="1.2">
      <line x1="0" y1="0" x2="-30" y2="-18"/><line x1="0" y1="0" x2="24" y2="-30"/>
      <line x1="0" y1="0" x2="38" y2="-4"/><line x1="0" y1="0" x2="0" y2="38"/>
      <line x1="0" y1="0" x2="-26" y2="28"/><line x1="0" y1="0" x2="-14" y2="14"/>
      <line x1="0" y1="0" x2="14" y2="10"/><line x1="0" y1="0" x2="12" y2="-14"/>
      <line x1="-30" y1="-18" x2="-6" y2="-36"/><line x1="-6" y1="-36" x2="24" y2="-30"/>
      <line x1="24" y1="-30" x2="38" y2="-4"/><line x1="38" y1="-4" x2="28" y2="26"/>
      <line x1="28" y1="26" x2="0" y2="38"/><line x1="0" y1="38" x2="-26" y2="28"/>
      <line x1="-26" y1="28" x2="-40" y2="4"/><line x1="-40" y1="4" x2="-30" y2="-18"/>
      <line x1="-14" y1="14" x2="-26" y2="28"/><line x1="14" y1="10" x2="28" y2="26"/>
      <line x1="12" y1="-14" x2="24" y2="-30"/><line x1="-30" y1="-18" x2="-14" y2="14"/>
      <line x1="12" y1="-14" x2="-6" y2="-36"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#C8385A"/>
    <circle cx="-30" cy="-18" r="6" fill="#C8385A"/>
    <circle cx="-6" cy="-36" r="4" fill="#D9B38C"/>
    <circle cx="24" cy="-30" r="5" fill="#C8385A"/>
    <circle cx="38" cy="-4" r="7" fill="#C8385A"/>
    <circle cx="28" cy="26" r="4" fill="#D9B38C"/>
    <circle cx="0" cy="38" r="5" fill="#D9B38C"/>
    <circle cx="-26" cy="28" r="6" fill="#C8385A"/>
    <circle cx="-40" cy="4" r="4" fill="#D9B38C"/>
    <circle cx="-14" cy="14" r="3.5" fill="#E07B39"/>
    <circle cx="14" cy="10" r="3.5" fill="#E07B39"/>
    <circle cx="12" cy="-14" r="3" fill="#E07B39"/>
  </g>
  <text x="1030" y="303" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Medical KG</text>
  </g>
</svg>
