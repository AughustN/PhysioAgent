  <line class="edge" x1="185" y1="235" x2="363" y2="235" marker-end="url(#ah)"/>
  <text class="arrowlbl" x="274" y="226" text-anchor="middle">LLM Extraction</text>
  <line class="edge" x1="185" y1="345" x2="363" y2="345" marker-end="url(#ah)"/>
  <text class="arrowlbl" x="274" y="336" text-anchor="middle">Path Search</text>


