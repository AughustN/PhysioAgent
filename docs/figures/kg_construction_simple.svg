      <line x1="56" y1="42" x2="80" y2="26"/><line x1="56" y1="42" x2="72" y2="62"/>
      <line x1="80" y1="26" x2="93" y2="48"/><line x1="72" y1="62" x2="93" y2="48"/>
      <line x1="32" y1="56" x2="46" y2="68"/><line x1="44" y1="18" x2="80" y2="26"/>
