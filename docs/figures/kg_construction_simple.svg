      <line x1="0" y1="0" x2="20" y2="18"/><line x1="0" y1="0" x2="-20" y2="16"/>
      <line x1="0" y1="0" x2="-12" y2="8"/><line x1="-22" y1="-14" x2="-8" y2="-26"/>
