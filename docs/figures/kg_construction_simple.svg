  <!-- merge -->
  <path class="edge" d="M475,345 H515 V246"/>
  <path class="edge" d="M475,235 H504"/>
  <circle cx="515" cy="235" r="11" fill="#fff" stroke="#111" stroke-width="2.4"/>
  <line x1="509" y1="235" x2="521" y2="235" stroke="#111" stroke-width="2.4"/>
  <line x1="515" y1="229" x2="515" y2="241" stroke="#111" stroke-width="2.4"/>
  <line class="edge" x1="526" y1="235" x2="578" y2="235" marker-end="url(#ah)"/>

