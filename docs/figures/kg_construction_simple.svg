<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="320" viewBox="0 0 1110 320"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .edge  { stroke:#4a4a4a; stroke-width:1.4; fill:none; }
      .group { stroke:#6b6b6b; stroke-width:1.3; stroke-dasharray:5 4; fill:none; }
      .hdr   { font-size:17px; font-weight:bold; fill:#111; }
      .dots  { stroke:#333; stroke-width:2.2; stroke-dasharray:0.1 6; stroke-linecap:round; }
      .tick  { stroke:#333; stroke-width:2; }
      .lbl   { font-size:14px; fill:#111; }
      .arrowlbl { font-size:13.5px; fill:#222; }
      .thumb { fill:#fff; stroke:#333; stroke-width:1.3; }
    </style>
  </defs>

  <rect x="0" y="0" width="1110" height="320" fill="#ffffff"/>

  <!-- headers -->
  <text class="hdr" x="292" y="38" text-anchor="middle">Triple Extraction</text>
  <line class="dots" x1="28" y1="54" x2="557" y2="54"/>
  <line class="tick" x1="25" y1="46" x2="25" y2="62"/>
  <line class="tick" x1="560" y1="46" x2="560" y2="62"/>

  <text class="hdr" x="835" y="38" text-anchor="middle">Integration</text>
  <line class="dots" x1="583" y1="54" x2="1087" y2="54"/>
  <line class="tick" x1="580" y1="46" x2="580" y2="62"/>
  <line class="tick" x1="1090" y1="46" x2="1090" y2="62"/>

  <g transform="translate(0,-110)">
  <!-- sources -->
  <rect class="group" x="25" y="190" width="160" height="210" rx="12"/>

  <g transform="translate(86,206) scale(1.5)" stroke="#2b5f9e" stroke-width="1.1" fill="#fff">
    <path d="M0,0 H12 L18,6 V24 H0 Z"/>
    <path d="M12,0 V6 H18" fill="none"/>
    <line x1="3" y1="11" x2="14" y2="11"/><line x1="3" y1="15" x2="14" y2="15"/><line x1="3" y1="19" x2="10" y2="19"/>
    <circle cx="19" cy="20" r="5" stroke-width="1.5"/>
    <line x1="22.5" y1="23.5" x2="26" y2="27" stroke-width="1.8"/>
  </g>
  <text x="105" y="277" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b5f9e">PubMed</text>

  <g transform="translate(84,318) scale(1.5)">
    <g stroke="#8e2d3a" stroke-width="1.1">
      <line x1="14" y1="4" x2="6" y2="15"/><line x1="14" y1="4" x2="22" y2="15"/>
      <line x1="6" y1="15" x2="2" y2="26"/><line x1="6" y1="15" x2="12" y2="26"/>
      <line x1="22" y1="15" x2="26" y2="26"/>
