      <circle cx="30" cy="64" r="3.4" fill="#34495e"/><circle cx="52" cy="46" r="5.4"/>
      <circle cx="70" cy="28" r="3.4" fill="#34495e"/><circle cx="64" cy="66" r="3.4"/>
