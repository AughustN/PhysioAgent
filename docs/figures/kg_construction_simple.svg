      <circle cx="2" cy="26" r="2.6"/><circle cx="12" cy="26" r="2.6"/><circle cx="26" cy="26" r="2.6"/>
    </g>
  </g>
  <text x="105" y="387" text-anchor="middle" font-size="15" font-weight="bold" fill="#8e2d3a">UMLS</text>

