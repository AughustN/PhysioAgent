<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="515" viewBox="0 0 1520 515"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .edge  { stroke:#4a4a4a; stroke-width:1.4; fill:none; }
      .group { stroke:#6b6b6b; stroke-width:1.3; stroke-dasharray:5 4; fill:none; }
      .hdr   { font-size:17px; font-weight:bold; fill:#111; }
      .dots  { stroke:#333; stroke-width:2.2; stroke-dasharray:0.1 6; stroke-linecap:round; }
      .tick  { stroke:#333; stroke-width:2; }
      .t14   { font-size:14px; fill:#111; }
      .t13b  { font-size:13px; font-weight:bold; fill:#111; }
      .t12   { font-size:12px; fill:#222; }
      .t11   { font-size:11px; fill:#555; }
      .t105  { font-size:10.5px; fill:#555; }
      .ital  { font-size:10.5px; font-style:italic; fill:#666; }
      .proc  { fill:#9ED9D4; stroke:#3E8E89; stroke-width:1.4; }
      .thumb { fill:#fff; stroke:#333; stroke-width:1.3; }
      .chip  { fill:#ececec; stroke:none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1520" height="515" fill="#ffffff"/>

  <!-- ============ SECTION HEADERS ============ -->
  <g id="headers">
    <text class="hdr" x="130" y="46" text-anchor="middle">Inputs</text>
    <line class="dots" x1="30" y1="62" x2="232" y2="62"/>
    <line class="tick" x1="27" y1="54" x2="27" y2="70"/>
    <line class="tick" x1="235" y1="54" x2="235" y2="70"/>

    <text class="hdr" x="555" y="46" text-anchor="middle">Source-Grounded Triple Extraction</text>
    <line class="dots" x1="255" y1="62" x2="857" y2="62"/>
    <line class="tick" x1="252" y1="54" x2="252" y2="70"/>
    <line class="tick" x1="860" y1="54" x2="860" y2="70"/>

    <text class="hdr" x="1190" y="46" text-anchor="middle">Integration &amp; Refinement</text>
    <line class="dots" x1="880" y1="62" x2="1500" y2="62"/>
    <line class="tick" x1="877" y1="54" x2="877" y2="70"/>
    <line class="tick" x1="1503" y1="54" x2="1503" y2="70"/>
  </g>

  <g transform="translate(0,-145)">
  <!-- ============ INPUT: CONCEPT SCOPE ============ -->
  <g id="input-mimic">
    <!-- One EHR input. The concept whitelist and the co-occurrence counting are steps
         inside it; the two arrows out say what each flow takes from it. -->
    <rect class="group" x="25" y="235" width="210" height="330" rx="12"/>
    <g transform="translate(130,372) scale(1.9) translate(-75,-424)"
       stroke="#C98B2E" stroke-width="0.8" fill="#FCE3B8">
      <path d="M52,408 V440 A23,6 0 0 0 98,440 V408"/>
      <ellipse cx="75" cy="408" rx="23" ry="6"/>
      <path d="M52,419 A23,6 0 0 0 98,419" fill="none"/>
      <path d="M52,430 A23,6 0 0 0 98,430" fill="none"/>
    </g>
    <text class="t14" x="130" y="448" text-anchor="middle" font-weight="bold">MIMIC-IV</text>
    <text class="t11" x="130" y="466" text-anchor="middle">97 concepts · CCS / ATC-3</text>
  </g>

  <!-- ============ ROW 1: PUBMED FLOW ============ -->
  <g id="row-pubmed">
    <line class="edge" x1="235" y1="345" x2="393" y2="345" marker-end="url(#ah)"/>
    <rect class="chip" x="248" y="299" width="138" height="36" rx="6"/>
    <text class="t12" x="317" y="314" text-anchor="middle">Query: concept</text>
    <text class="t12" x="317" y="329" text-anchor="middle">+ companions + anchor</text>

    <rect class="proc" x="395" y="317" width="210" height="56" rx="4"/>
    <!-- LLM chip icon -->
    <g transform="translate(409,333)" stroke="#2d5f5c" stroke-width="1.2">
      <rect x="4" y="4" width="20" height="20" rx="3" fill="#fff"/>
      <line x1="9" y1="0" x2="9" y2="4"/><line x1="14" y1="0" x2="14" y2="4"/><line x1="19" y1="0" x2="19" y2="4"/>
      <line x1="9" y1="24" x2="9" y2="28"/><line x1="14" y1="24" x2="14" y2="28"/><line x1="19" y1="24" x2="19" y2="28"/>
      <line x1="0" y1="9" x2="4" y2="9"/><line x1="0" y1="14" x2="4" y2="14"/><line x1="0" y1="19" x2="4" y2="19"/>
      <line x1="24" y1="9" x2="28" y2="9"/><line x1="24" y1="14" x2="28" y2="14"/><line x1="24" y1="19" x2="28" y2="19"/>
      <text x="14" y="16.5" font-size="6.5" font-weight="bold" text-anchor="middle" fill="#2d5f5c" stroke="none">LLM</text>
    </g>
    <text class="t14" x="522" y="350" text-anchor="middle">LLM Triple Reader</text>

    <!-- PubMed corpus -->
    <rect class="group" x="415" y="395" width="170" height="62" rx="10"/>
    <g transform="translate(428,403)" stroke="#2b5f9e" stroke-width="1.2" fill="#fff">
      <path d="M0,0 H12 L18,6 V24 H0 Z"/>
      <path d="M12,0 V6 H18" fill="none"/>
      <line x1="3" y1="11" x2="14" y2="11"/><line x1="3" y1="15" x2="14" y2="15"/><line x1="3" y1="19" x2="10" y2="19"/>
      <circle cx="19" cy="20" r="5" fill="#fff" stroke-width="1.6"/>
      <line x1="22.5" y1="23.5" x2="26" y2="27" stroke-width="2"/>
    </g>
    <text x="516" y="424" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b5f9e">PubMed</text>
    <line class="edge" x1="500" y1="395" x2="500" y2="375" marker-end="url(#ah)"/>

    <!-- grounding check -->
    <line class="edge" x1="605" y1="345" x2="650" y2="345" marker-end="url(#ah)"/>
    <path d="M668,326 L684,332 V346 C684,356 677,363 668,366 C659,363 652,356 652,346 V332 Z"
          fill="#E8F6EF" stroke="#2E8B57" stroke-width="1.6"/>
    <path d="M660,346 L666,352 L677,339" fill="none" stroke="#2E8B57" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <line class="edge" x1="684" y1="345" x2="738" y2="345" marker-end="url(#ah)"/>

    <rect class="thumb" x="740" y="305" width="110" height="80" rx="8"/>
    <g transform="translate(740,305)">
      <g stroke="#8a8a8a" stroke-width="1.1">
        <line x1="18" y1="30" x2="44" y2="18"/><line x1="18" y1="30" x2="32" y2="56"/>
        <line x1="44" y1="18" x2="56" y2="42"/><line x1="32" y1="56" x2="56" y2="42"/>
        <line x1="56" y1="42" x2="80" y2="26"/><line x1="56" y1="42" x2="72" y2="62"/>
        <line x1="80" y1="26" x2="93" y2="48"/><line x1="72" y1="62" x2="93" y2="48"/>
        <line x1="32" y1="56" x2="46" y2="68"/><line x1="44" y1="18" x2="80" y2="26"/>
      </g>
      <g fill="#2E86C1">
        <circle cx="18" cy="30" r="3.4"/><circle cx="44" cy="18" r="3.4"/>
        <circle cx="32" cy="56" r="3.4"/><circle cx="56" cy="42" r="4.4"/>
        <circle cx="80" cy="26" r="3.4"/><circle cx="72" cy="62" r="3.4"/>
        <circle cx="93" cy="48" r="3.4"/><circle cx="46" cy="68" r="3" fill="#34495e"/>
      </g>
    </g>
    <text class="t12" x="795" y="402" text-anchor="middle">1,549 triples</text>
  </g>

  <!-- ============ ROW 2: UMLS FLOW ============ -->
  <g id="row-umls">
    <line class="edge" x1="235" y1="525" x2="393" y2="525" marker-end="url(#ah)"/>
    <rect class="chip" x="248" y="479" width="138" height="36" rx="6"/>
    <text class="t12" x="317" y="494" text-anchor="middle">Endpoints:</text>
    <text class="t12" x="317" y="509" text-anchor="middle">co-occurring pair</text>

    <rect class="proc" x="395" y="497" width="210" height="56" rx="4"/>
    <text class="t14" x="500" y="521" text-anchor="middle">Gated Bidirectional</text>
    <text class="t14" x="500" y="539" text-anchor="middle">Path Search</text>

    <!-- UMLS corpus -->
    <rect class="group" x="415" y="575" width="170" height="62" rx="10"/>
    <g transform="translate(424,582)">
      <g stroke="#8e2d3a" stroke-width="1.2">
        <line x1="14" y1="4" x2="6" y2="15"/><line x1="14" y1="4" x2="22" y2="15"/>
        <line x1="6" y1="15" x2="2" y2="26"/><line x1="6" y1="15" x2="12" y2="26"/>
        <line x1="22" y1="15" x2="26" y2="26"/>
      </g>
      <g fill="#8e2d3a">
        <circle cx="14" cy="4" r="3.4"/><circle cx="6" cy="15" r="3"/><circle cx="22" cy="15" r="3"/>
        <circle cx="2" cy="26" r="2.6"/><circle cx="12" cy="26" r="2.6"/><circle cx="26" cy="26" r="2.6"/>
      </g>
    </g>
    <text x="516" y="604" text-anchor="middle" font-size="17" font-weight="bold" fill="#8e2d3a">UMLS</text>
    <line class="edge" x1="500" y1="575" x2="500" y2="555" marker-end="url(#ah)"/>

    <line class="edge" x1="605" y1="525" x2="738" y2="525" marker-end="url(#ah)"/>

    <rect class="thumb" x="740" y="485" width="110" height="80" rx="8"/>
    <g transform="translate(740,485)">
      <g stroke="#8a8a8a" stroke-width="1.1">
        <line x1="20" y1="40" x2="38" y2="20"/><line x1="20" y1="40" x2="30" y2="64"/>
        <line x1="38" y1="20" x2="52" y2="46"/><line x1="30" y1="64" x2="52" y2="46"/>
        <line x1="52" y1="46" x2="70" y2="28"/><line x1="52" y1="46" x2="64" y2="66"/>
        <line x1="70" y1="28" x2="88" y2="50"/><line x1="64" y1="66" x2="88" y2="50"/>
      </g>
      <g fill="#3CC9A0">
        <circle cx="20" cy="40" r="3.4"/><circle cx="38" cy="20" r="3.4" fill="#34495e"/>
        <circle cx="30" cy="64" r="3.4" fill="#34495e"/><circle cx="52" cy="46" r="5.4"/>
        <circle cx="70" cy="28" r="3.4" fill="#34495e"/><circle cx="64" cy="66" r="3.4"/>
        <circle cx="88" cy="50" r="5"/>
      </g>
    </g>
    <text class="t12" x="795" y="582" text-anchor="middle">1,338 triples</text>
  </g>

  <!-- ============ MERGE ============ -->
  <g id="merge">
    <path class="edge" d="M850,525 H885 V357"/>
    <path class="edge" d="M850,345 H873"/>
    <circle cx="885" cy="345" r="11" fill="#fff" stroke="#111" stroke-width="2.4"/>
    <line x1="879" y1="345" x2="891" y2="345" stroke="#111" stroke-width="2.4"/>
    <line x1="885" y1="339" x2="885" y2="351" stroke="#111" stroke-width="2.4"/>
    <line class="edge" x1="896" y1="345" x2="928" y2="345" marker-end="url(#ah)"/>
  </g>

  <!-- ============ RAW KG ============ -->
  <g id="raw-kg">
    <g transform="translate(962,345)">
      <g stroke="#9a9a9a" stroke-width="1.1">
        <line x1="0" y1="0" x2="-22" y2="-14"/><line x1="0" y1="0" x2="14" y2="-22"/>
        <line x1="0" y1="0" x2="20" y2="18"/><line x1="0" y1="0" x2="-20" y2="16"/>
        <line x1="0" y1="0" x2="-12" y2="8"/><line x1="-22" y1="-14" x2="-8" y2="-26"/>
        <line x1="-8" y1="-26" x2="14" y2="-22"/><line x1="14" y1="-22" x2="26" y2="-4"/>
        <line x1="26" y1="-4" x2="20" y2="18"/><line x1="20" y1="18" x2="2" y2="26"/>
        <line x1="2" y1="26" x2="-20" y2="16"/><line x1="-20" y1="16" x2="-28" y2="0"/>
        <line x1="-28" y1="0" x2="-22" y2="-14"/><line x1="0" y1="0" x2="26" y2="-4"/>
        <line x1="-8" y1="-26" x2="0" y2="0"/>
      </g>
      <circle cx="0" cy="0" r="5.5" fill="#2E86C1"/>
      <circle cx="-22" cy="-14" r="4" fill="#E67E22"/>
      <circle cx="-8" cy="-26" r="3.6" fill="#3CC9A0"/>
      <circle cx="14" cy="-22" r="4" fill="#2E86C1"/>
      <circle cx="26" cy="-4" r="3.6" fill="#3CC9A0"/>
      <circle cx="20" cy="18" r="4" fill="#E67E22"/>
      <circle cx="2" cy="26" r="3.6" fill="#2E86C1"/>
      <circle cx="-20" cy="16" r="4" fill="#3CC9A0"/>
      <circle cx="-28" cy="0" r="3.2" fill="#2E86C1"/>
      <circle cx="-12" cy="8" r="3" fill="#E67E22"/>
    </g>
    <text class="t13b" x="962" y="398" text-anchor="middle">Raw KG</text>
    <text class="t105" x="962" y="414" text-anchor="middle">2,695 edges</text>
    <line class="edge" x1="998" y1="345" x2="1063" y2="345" marker-end="url(#ah)"/>
  </g>

  <!-- ============ REFINEMENT ============ -->
  <g id="refine">
    <rect class="group" x="1065" y="212" width="225" height="266" rx="12"/>
    <text class="t13b" x="1177" y="234" text-anchor="middle">Entity &amp; Relation Merging</text>

    <rect x="1078" y="246" width="199" height="44" rx="4" fill="#CDEDEA" stroke="#3E8E89" stroke-width="1.3"/>
    <text x="1088" y="272" font-size="12" font-weight="bold" fill="#111">① String normalisation</text>

    <line class="edge" x1="1177" y1="290" x2="1177" y2="302" marker-end="url(#ah)"/>

    <rect x="1078" y="304" width="199" height="44" rx="4" fill="#CDEDEA" stroke="#3E8E89" stroke-width="1.3"/>
    <text x="1088" y="330" font-size="12" font-weight="bold" fill="#111">② UMLS CUI merge</text>

    <line class="edge" x1="1177" y1="348" x2="1177" y2="360" marker-end="url(#ah)"/>

    <rect x="1078" y="362" width="199" height="44" rx="4" fill="#E4DDF4" stroke="#7D6BB3" stroke-width="1.3"/>
    <text x="1088" y="388" font-size="12" font-weight="bold" fill="#111">③ Embedding clustering</text>

    <line class="edge" x1="1177" y1="406" x2="1177" y2="418" marker-end="url(#ah)"/>

    <rect x="1078" y="420" width="199" height="44" rx="4" fill="#EEEEEE" stroke="#888" stroke-width="1.3"/>
    <text x="1088" y="446" font-size="12" font-weight="bold" fill="#111">④ Pin CCS / ATC names</text>


    <line class="edge" x1="1290" y1="345" x2="1352" y2="345" marker-end="url(#ah)"/>
  </g>

  <!-- ============ REFINED KG ============ -->
  <g id="refined-kg">
    <g transform="translate(1400,345)">
      <g stroke="#D08A5C" stroke-width="1.2">
        <line x1="0" y1="0" x2="-30" y2="-18"/><line x1="0" y1="0" x2="24" y2="-30"/>
        <line x1="0" y1="0" x2="38" y2="-4"/><line x1="0" y1="0" x2="0" y2="38"/>
        <line x1="0" y1="0" x2="-26" y2="28"/><line x1="0" y1="0" x2="-14" y2="14"/>
        <line x1="0" y1="0" x2="14" y2="10"/><line x1="0" y1="0" x2="12" y2="-14"/>
        <line x1="-30" y1="-18" x2="-6" y2="-36"/><line x1="-6" y1="-36" x2="24" y2="-30"/>
        <line x1="24" y1="-30" x2="38" y2="-4"/><line x1="38" y1="-4" x2="28" y2="26"/>
        <line x1="28" y1="26" x2="0" y2="38"/><line x1="0" y1="38" x2="-26" y2="28"/>
        <line x1="-26" y1="28" x2="-40" y2="4"/><line x1="-40" y1="4" x2="-30" y2="-18"/>
        <line x1="-14" y1="14" x2="-26" y2="28"/><line x1="14" y1="10" x2="28" y2="26"/>
        <line x1="12" y1="-14" x2="24" y2="-30"/><line x1="-30" y1="-18" x2="-14" y2="14"/>
        <line x1="12" y1="-14" x2="-6" y2="-36"/>
      </g>
      <circle cx="0" cy="0" r="8" fill="#C8385A"/>
      <circle cx="-30" cy="-18" r="6" fill="#C8385A"/>
      <circle cx="-6" cy="-36" r="4" fill="#D9B38C"/>
      <circle cx="24" cy="-30" r="5" fill="#C8385A"/>
      <circle cx="38" cy="-4" r="7" fill="#C8385A"/>
      <circle cx="28" cy="26" r="4" fill="#D9B38C"/>
      <circle cx="0" cy="38" r="5" fill="#D9B38C"/>
      <circle cx="-26" cy="28" r="6" fill="#C8385A"/>
      <circle cx="-40" cy="4" r="4" fill="#D9B38C"/>
      <circle cx="-14" cy="14" r="3.5" fill="#E07B39"/>
      <circle cx="14" cy="10" r="3.5" fill="#E07B39"/>
      <circle cx="12" cy="-14" r="3" fill="#E07B39"/>
    </g>
    <text x="1400" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Refined Medical KG</text>
    <text class="t11" x="1400" y="428" text-anchor="middle">2,599 edges</text>
  </g>
  </g>
</svg>
